<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:,"><title>Seeing & hearing · Reality Movies</title>
<style>
html,body{margin:0;height:100%;background:#07080c;color:#eee;font:15px/1.4 -apple-system,system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none}
canvas{display:block;position:fixed;inset:0}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 10px) 14px 8px;background:linear-gradient(#07080cee,#07080c00);pointer-events:none}
#top h1{margin:0;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#9ab}
#room{font-size:17px;font-weight:600;margin-top:2px}
#roomnote{font-size:12px;color:#aab;margin-top:2px;max-width:640px}
#bar{display:flex;gap:2px;margin-top:6px;max-width:640px}#bar i{flex:1;height:4px;background:#334;border-radius:2px}#bar i.on{background:#ffd27a}#bar i.thin{opacity:.5}
#card{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom) + 64px);max-width:560px;margin:0 auto;background:#12141cf0;border:1px solid #2a2f40;border-radius:14px;padding:14px 16px;box-shadow:0 8px 30px #0008;transition:opacity .3s}
#card.thin{border-style:dashed;background:#12141cc8}
#card .y{color:#ffd27a;font-weight:700;font-size:13px}#card .t{font-size:12px;color:#9ab;margin:2px 0 6px}
#card .c{font-size:16px}#card .s{font-size:12.5px;color:#bbc;margin-top:6px}
#card details{margin-top:6px;font-size:11.5px;color:#99a}#card summary{cursor:pointer;color:#8ac}
.tag{display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:8px;background:#2a3348;margin-left:6px;color:#cde}.tag.thin{background:#4a3a20;color:#fc9}
#nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 10px);display:flex;justify-content:center;gap:10px}
#nav button{min-width:96px;height:44px;border-radius:22px;border:1px solid #3a4258;background:#1a1e2a;color:#eee;font-size:15px}
#hint{position:fixed;top:50%;left:0;right:0;text-align:center;color:#ccd;font-size:13px;opacity:.8;pointer-events:none;transition:opacity 1s}
@media(min-width:900px){#card{left:auto;right:28px;bottom:84px;width:420px}#card .c{font-size:17px}}
</style></head><body>
<div id="top"><h1>Reality Movies · Seeing &amp; hearing</h1><div id="room"></div><div id="roomnote"></div><div id="bar"></div></div>
<div id="hint">Swipe, scroll, tap Next or use the arrow keys</div>
<div id="card"></div>
<div id="nav"><button id="prev" aria-label="Previous">‹ Back</button><button id="next" aria-label="Next">Next ›</button></div>
<script src="data.js"></script>
<script type="module">
import * as THREE from './vendor/three.module.min.js';
const F=window.FIELD, stops=[];
F.rooms.forEach((r,ri)=>r.cards.forEach(c=>stops.push({...c,ri})));
// intro stop 0 + 20 cards + outro
const N=stops.length+2;
const LIGHT={dim:.25,half:.55,bright:1};
const RD=14, renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color(0x07080c);scene.fog=new THREE.Fog(0x07080c,6,30);
const cam=new THREE.PerspectiveCamera(62,1,.1,200);
scene.add(new THREE.AmbientLight(0xffffff,.15));
function label(text,w=512,h=128,size=40,color='#eee',bg=null){const cv=document.createElement('canvas');cv.width=w;cv.height=h;const g=cv.getContext('2d');if(bg){g.fillStyle=bg;g.fillRect(0,0,w,h)}g.fillStyle=color;g.font=`600 ${size}px system-ui,sans-serif`;g.textAlign='center';g.textBaseline='middle';
 const words=text.split(' ');let lines=[''];for(const wd of words){const t=(lines.at(-1)+' '+wd).trim();if(g.measureText(t).width>w-30&&lines.at(-1))lines.push(wd);else lines[lines.length-1]=t}
 lines=lines.slice(0,4);lines.forEach((l,i)=>g.fillText(l,w/2,h/2+(i-(lines.length-1)/2)*size*1.15));const tx=new THREE.CanvasTexture(cv);tx.colorSpace=THREE.SRGBColorSpace;return tx}
const plinthPos=[];let k=0;
F.rooms.forEach((r,ri)=>{const z0=ri*RD, L=LIGHT[r.light];
 const col=new THREE.Color().setHSL(.6-ri*.08,.35,.12+.18*L);
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(10,RD),new THREE.MeshStandardMaterial({color:col,roughness:.9}));floor.rotation.x=-Math.PI/2;floor.position.set(0,0,z0+RD/2);scene.add(floor);
 for(const s of[-1,1]){const w=new THREE.Mesh(new THREE.PlaneGeometry(RD,4),new THREE.MeshStandardMaterial({color:col.clone().multiplyScalar(1.3),roughness:1}));w.rotation.y=-s*Math.PI/2;w.position.set(s*5,2,z0+RD/2);scene.add(w)}
 const pl=new THREE.PointLight(0xffe6c0,18*L,16,1.6);pl.position.set(0,3.6,z0+RD/2);scene.add(pl);
 // doorway arch + era label
 const arch=new THREE.Mesh(new THREE.TorusGeometry(1.6,.08,8,32,Math.PI),new THREE.MeshBasicMaterial({color:L<.5?0x556:0xffd27a}));arch.position.set(0,2,z0+.05);scene.add(arch);
 const sign=new THREE.Mesh(new THREE.PlaneGeometry(3.2,.8),new THREE.MeshBasicMaterial({map:label(r.name.split('· ')[1]||r.name,512,128,34,L<.5?'#99a':'#ffd27a'),transparent:true}));sign.position.set(0,3.4,z0+.06);scene.add(sign);
 const n=r.cards.length;r.cards.forEach((c,i)=>{const side=(k%2)?1:-1;const z=z0+1.5+(i+.5)*(RD-3)/n;
  const p=new THREE.Mesh(new THREE.BoxGeometry(.9,1,.9),new THREE.MeshStandardMaterial({color:c.thin?0x444650:0x8a8fa8,roughness:.6}));p.position.set(side*3.6,.5,z);scene.add(p);
  const card=new THREE.Mesh(new THREE.PlaneGeometry(1.6,1),new THREE.MeshBasicMaterial({map:label(c.year+' · '+c.title.replace(/\s*\(.*$/,''),512,320,34,c.thin?'#aa9':'#fff',c.thin?'#22232a':'#1d2436'),transparent:true,opacity:c.thin?.55:1}));
  card.position.set(side*4.9,1.9,z);card.rotation.y=-side*Math.PI/2;scene.add(card);
  const glow=new THREE.Mesh(new THREE.SphereGeometry(.12,16,16),new THREE.MeshBasicMaterial({color:c.thin?0x776655:0xffd27a}));glow.position.set(side*3.6,1.2,z);scene.add(glow);
  plinthPos.push(new THREE.Vector3(side*3.6,1.2,z));k++;});
});
// threads between listed markers (link titles start with marker title)
const tmat=new THREE.LineBasicMaterial({color:0x8899bb,transparent:true,opacity:.35});
stops.forEach((a,i)=>a.links.forEach(t=>{const j=stops.findIndex(b=>b.title.startsWith(t.slice(0,30)));if(j>i||(j>=0&&j<i&&!stops[j].links.some(x=>a.title.startsWith(x.slice(0,30))))){const p=plinthPos[i],q=plinthPos[j],m=p.clone().add(q).multiplyScalar(.5);m.y=3.6;
 scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(new THREE.QuadraticBezierCurve3(p,m,q).getPoints(24)),tmat))}}));
// hearing alcove: empty frame at end
const endZ=F.rooms.length*RD;
const hf=new THREE.Mesh(new THREE.PlaneGeometry(3,1.4),new THREE.MeshBasicMaterial({map:label('Hearing: no marker in this top 20',512,200,34,'#99a','#15161c')}));hf.position.set(0,1.9,endZ+.5);hf.rotation.y=Math.PI;scene.add(hf);
const wall=new THREE.Mesh(new THREE.PlaneGeometry(10,4),new THREE.MeshBasicMaterial({color:0x101218}));wall.position.set(0,2,endZ+.55);wall.rotation.y=Math.PI;scene.add(wall);
// camera poses
function pose(i){if(i<=0)return{p:new THREE.Vector3(0,1.6,-4),l:new THREE.Vector3(0,1.6,4)};
 if(i>=N-1)return{p:new THREE.Vector3(0,1.6,endZ-3.5),l:new THREE.Vector3(0,1.8,endZ+1)};
 const q=plinthPos[i-1];const p=new THREE.Vector3(q.x*.15,1.6,q.z-2.6);return{p,l:new THREE.Vector3(q.x*1.2,1.5,q.z+.4)}}
let idx=Math.max(0,Math.min(N-1,parseInt(new URLSearchParams(location.search).get('stop')||'0')));
let t=idx;const cp=pose(idx),curP=cp.p.clone(),curL=cp.l.clone();
const $=s=>document.querySelector(s);
$('#bar').innerHTML=stops.map(s=>`<i class="${s.thin?'thin':''}"></i>`).join('');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ui(){const bars=[...document.querySelectorAll('#bar i')];bars.forEach((b,j)=>b.classList.toggle('on',j<idx));
 const card=$('#card');
 if(idx===0){$('#room').textContent='Entrance';$('#roomnote').textContent='Five era-rooms, 1851 to 2024. Dim rooms mean thin evidence.';card.className='';card.innerHTML=`<div class="y">How seeing came to be understood</div><div class="c">${esc(F.arc.split('\n')[1])}</div><div class="s">20 markers from Pixel Hound. Captions use only facts from each marker's receipt.</div>`}
 else if(idx===N-1){$('#room').textContent='The unfinished wall';$('#roomnote').textContent='';card.className='thin';card.innerHTML=`<div class="y">What this walk doesn't show</div>${F.gaps.map(g=>`<div class="s">• ${esc(g)}</div>`).join('')}`}
 else{const s=stops[idx-1],r=F.rooms[s.ri];$('#room').textContent=r.name;$('#roomnote').textContent=r.note;card.className=s.thin?'thin':'';
  card.innerHTML=`<div class="y">${s.year}<span class="tag ${s.thin?'thin':''}">${s.thin?'thin evidence':esc(s.rating)}</span><span class="tag">${s.n}/20</span></div><div class="t">${esc(s.title)}</div><div class="c">${esc(s.cap)}</div><div class="s">On screen: ${esc(s.screen)}</div><details><summary>Receipt</summary>${esc(s.receipt)}<br>Summary line: “${esc(s.summary)}”${s.thin?'<br>Thin because: '+esc(s.thin_reasons.join(', ')):''}${s.links.length?'<br>Connects to: '+esc(s.links.join('; ')):''}${s.url?`<br><a style="color:#8ac" href="${esc(s.url)}" target="_blank" rel="noopener">source</a>`:''}</details>`}
 $('#prev').disabled=idx===0;$('#next').disabled=idx===N-1;history.replaceState(null,'','?stop='+idx);window.__state={idx,N,room:$('#room').textContent};}
function go(d){const n=Math.max(0,Math.min(N-1,idx+d));if(n!==idx){idx=n;ui()}$('#hint').style.opacity=0}
$('#next').onclick=()=>go(1);$('#prev').onclick=()=>go(-1);
addEventListener('keydown',e=>{if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){go(1);e.preventDefault()}if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){go(-1);e.preventDefault()}});
let wheelAcc=0,wheelLock=0;addEventListener('wheel',e=>{if(e.target.closest('#card'))return;e.preventDefault();const now=performance.now();if(now<wheelLock)return;wheelAcc+=e.deltaY;if(Math.abs(wheelAcc)>60){go(Math.sign(wheelAcc));wheelAcc=0;wheelLock=now+450}},{passive:false});
let sx=0,sy=0,st=0;addEventListener('touchstart',e=>{const p=e.touches[0];sx=p.clientX;sy=p.clientY;st=Date.now()},{passive:true});
addEventListener('touchend',e=>{if(e.target.closest('button,details,a'))return;const p=e.changedTouches[0],dx=p.clientX-sx,dy=p.clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))>40){go(Math.abs(dx)>Math.abs(dy)?(dx<0?1:-1):(dy<0?1:-1))}else if(Date.now()-st<300&&!e.target.closest('#card'))go(p.clientX<innerWidth*.3?-1:1)});
function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.fov=cam.aspect<.8?72:58;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();ui();
function loop(){const g=pose(idx);curP.lerp(g.p,.06);curL.lerp(g.l,.06);cam.position.copy(curP);cam.lookAt(curL);renderer.render(scene,cam);window.__frames=(window.__frames||0)+1;requestAnimationFrame(loop)}loop();
</script></body></html>

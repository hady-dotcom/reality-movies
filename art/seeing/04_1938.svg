<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs><radialGradient id="bg" cx="50%" cy="58%" r="75%"><stop offset="0" stop-color="#3a2412"/><stop offset=".55" stop-color="#1a0f08"/><stop offset="1" stop-color="#070504"/></radialGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/><feColorMatrix in="b" type="matrix" values="1 0 0 0 .1  0 .85 0 0 .04  0 0 .5 0 0  0 0 0 1.1 0" result="g"/><feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<filter id="tglow" x="-10%" y="-40%" width="120%" height="180%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<linearGradient id="yg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6a8"/><stop offset="1" stop-color="#d9902e"/></linearGradient></defs>
<rect width="1024" height="1024" fill="url(#bg)"/>
<rect x="34" y="34" width="956" height="956" rx="26" fill="none" stroke="#f3c56b" stroke-width="2" opacity=".45" />
<text x="92" y="214" font-family="Georgia,'Times New Roman',serif" font-size="150" font-weight="bold" fill="url(#yg)" filter="url(#tglow)" opacity="1">1938</text>
<text x="932" y="110" text-anchor="end" font-family="Georgia,serif" font-size="30" fill="#f3c56b" opacity=".8">04 / 20</text>
<text x="92" y="286" font-family="Georgia,'Times New Roman',serif" font-size="40" fill="#fbe9c6" opacity=".95">Hartline</text><text x="92" y="330" font-family="Georgia,serif" font-style="italic" font-size="28" fill="#f3c56b" opacity=".85">Optic nerve spikes</text>
<g transform="translate(112,250) scale(.78)" filter="url(#glow)" opacity="1"><circle cx="250" cy="330" r="80" fill="none" stroke="#f3c56b" stroke-width="4"/><line x1="360" y1="330" x2="800" y2="330" stroke="#f3c56b" stroke-width="8" stroke-linecap="round" /><rect x="200" y="220" width="90" height="38" rx="9" fill="#fbe9c6" stroke="none" stroke-width="4"/><line x1="420" y1="330" x2="420" y2="265" stroke="#fbe9c6" stroke-width="8" stroke-linecap="round" /><line x1="460" y1="330" x2="460" y2="265" stroke="#fbe9c6" stroke-width="8" stroke-linecap="round" /><line x1="500" y1="330" x2="500" y2="265" stroke="#fbe9c6" stroke-width="8" stroke-linecap="round" /><line x1="625" y1="330" x2="625" y2="265" stroke="#fbe9c6" stroke-width="8" stroke-linecap="round" /><line x1="665" y1="330" x2="665" y2="265" stroke="#fbe9c6" stroke-width="8" stroke-linecap="round" /><line x1="705" y1="330" x2="705" y2="265" stroke="#fbe9c6" stroke-width="8" stroke-linecap="round" /><line x1="745" y1="330" x2="745" y2="265" stroke="#fbe9c6" stroke-width="8" stroke-linecap="round" /><text x="510" y="480" fill="#fbe9c6" font-family="Georgia,serif" font-size="26" text-anchor="middle">light change → spike train</text></g>

<line x1="92" y1="884" x2="932" y2="884" stroke="#f3c56b" stroke-width="1.5" opacity=".35"/>
<text x="92" y="930" font-family="Georgia,serif" font-style="italic" font-size="31" fill="#fbe9c6" opacity=".92">One nerve fibre responds to changes in light.</text>

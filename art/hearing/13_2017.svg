<text x="92" y="286" font-family="Georgia,serif" font-size="40" fill="#fbe9c6" opacity=".95">Parras et al.</text><text x="92" y="330" font-family="Georgia,serif" font-style="italic" font-size="26" fill="#f3c56b" opacity=".85">Neurons along the auditory pathway exhibit a…</text>
